name: Update Hugo Modules

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: 'write'
    env:
      HUGO_VERSION: '0.148.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Update Hugo Modules
        run: |
          export GOPRIVATE=github.com/meganii/vault-content,github.com/meganii/affiliate-data,github.com/meganii/amazon-product-data,github.com/meganii/tweet-data
          git config --global url."https://${{ secrets.GO_MODULE_TOKEN_MEGANII_COM }}:@github.com/".insteadOf "https://github.com/"
          hugo mod get -u
          hugo mod tidy

      - name: Commit & Push updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum
          git commit -m "Update Hugo modules from content-vault $(date)"
          git push origin main